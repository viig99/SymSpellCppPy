name: CI

on:
  pull_request:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: CPython ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
        include:
          - {os: windows-latest, python: "3.10"}
          - {os: windows-latest, python: "3.15"}
          - {os: macos-latest, python: "3.10"}
          - {os: macos-latest, python: "3.15"}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install ".[test]"
      - run: python -m pytest
      - run: python examples/quickstart.py

  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: cmake -S . -B build/native -DBUILD_FOR_TEST=ON -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build/native --parallel 2
      - run: ctest --test-dir build/native --output-on-failure

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python -m pip install ".[test]" gcovr -Cbuild-dir=build/coverage -Ccmake.define.ENABLE_COVERAGE=ON
      - run: python -m pytest
      - name: Report native and binding coverage
        run: |
          gcovr --root . --filter '^(library\.(cpp|h)|unicode\.cpp|SymSpellCppPy\.cpp|include/(Helpers|DamerauOSA|EditDistance)\.h)$' --print-summary --xml coverage.xml build/coverage
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python -m pip install ".[docs]"
      - run: python -m sphinx -W --keep-going -b html docs/source build/docs
      - run: python -m sphinx -W -b doctest docs/source build/doctest
